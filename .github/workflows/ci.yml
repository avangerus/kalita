name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 3 * * *' # nightly — see the `passport` job below
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: kalita
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      KALITA_TEST_PG_DSN: postgres://postgres:kalita@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - name: gofmt
        run: test -z "$(gofmt -l cmd internal tests | tee /dev/stderr)"
      - run: go build ./...
      # LLD-01 §3: side-effect errors in automation cascades must be journaled,
      # never swallowed — bans blank assignments on createTask/applyTransition
      # paths (explicit exceptions live in the allowlist file).
      - run: bash scripts/check-automation-error-swallow.sh
      - run: go test ./... -count=1 -cover
      # bench smoke: catches order-of-magnitude regressions at compile level
      - run: go test -bench=Bench -benchtime=50x -run='^$' ./internal/engine
      # golden-journal fold-compatibility gate (docs/lld/LLD-03-upgrade-eras.md
      # §3/§7, PR-0): the binary built from THIS commit must still replay every
      # testdata/golden/*/journal.jsonl into the projections committed beside
      # it. Also covered by the blanket `go test ./...` above (it is ./tests/...);
      # kept as its own step so a fold regression is unmistakable in CI logs.
      - run: go test ./tests/... -run TestGoldenReplay -v
      # release hygiene (RELEASE-1.0 (git 5447fc5) DoD): known-vulnerability scan of
      # the module graph. A finding fails the build — triage it, do not mute.
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  # Data-race gate: internal/identity Registry (mutex + tokenIndex),
  # internal/eventstore MemStore, and the net/http servers in internal/api /
  # internal/mcp are all concurrent code that the `test` job above never
  # exercises under -race — release hygiene, not optional.
  #
  # `-short` is required here, not decorative: TestReplayBudget1M
  # (internal/eventstore/replay_budget_test.go) is a WALL-CLOCK timing
  # budget (1M-event replay must fold in <5s), and TestPermittedSetNarrowsAtScale
  # / TestRefPathPermittedSetNarrows (internal/engine/scale_test.go) each seed
  # 20k records — all three already carry a `testing.Short()` skip guard
  # (checked in prior commits) for exactly this reason: under -race,
  # instrumentation can slow single-threaded/heavy-seed code several-fold,
  # which would either flake the timing budget or waste minutes re-seeding
  # data with nothing concurrent to race on. None of the three are
  # concurrency tests, so skipping them under -race loses no race coverage.
  # Ordinary functional tests are NOT short-guarded and still run here.
  #
  # No `continue-on-error`: a race found here must fail the build, or the
  # gate is theater. `-timeout=10m` gives -race's slowdown real headroom
  # while still catching a genuine hang.
  race:
    name: race detector
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -race -short -count=1 -timeout=10m ./...

  # Python workers: the agent/integration layer (connectors, subscriptions,
  # prompt-injection perimeter, builder, agent_runner, bridge, chat_runner,
  # knowvault_*). All suites run against mocks/local fixtures; tests that need a
  # live node skip themselves (test_facade_live without Go on PATH,
  # test_builder_live without KALITA_LIVE_TEST=1).
  workers:
    name: python workers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pytest
      - run: python -m pytest workers -q

  # Node performance passport (docs/HLD-V1.md §H10, RELEASE-1.0 (git 5447fc5) N6/N9):
  # P1 pilot mix, P2 bulk create, P3 journal replay, P4 auth storm — see
  # `make passport` / internal/engine/passport_bench_test.go /
  # internal/eventstore/replay_bench_test.go. Deliberately NOT part of the
  # `test` job above: it never runs on push/pull_request (the `if:` below),
  # so it cannot block or slow a PR, and `continue-on-error` keeps a bad
  # number from red-X'ing even a manual/nightly run — these ns/op lines are
  # informational, not a gate (nothing enforces a ">20% regression" threshold
  # on them yet). The existing PR-gate bench smoke step above
  # (`-bench=Bench ./internal/engine`) is unaffected: these benchmarks are
  # compiled only under -tags=passport.
  #
  # P3 at the 1M scale is the one exception: it additionally has a HARD,
  # PR-gating budget test — TestReplayBudget1M (internal/eventstore/
  # replay_budget_test.go, no build tag) — which runs as part of the ordinary
  # `go test ./...` step in the `test` job above, on every push/PR, and fails
  # the build if a 1,000,000-event engine.New() replay exceeds 5s (LLD-12 §4).
  # That test is a fixed wall-clock budget with margin, not a %-regression
  # comparison against a prior run (there is no stored baseline to diff
  # against in CI) — deliberately simpler and cannot flap between runs on the
  # same class of CI runner.
  passport:
    name: performance passport (informational)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet -tags=passport ./internal/engine/... ./internal/eventstore/...
      - name: P1 pilot mix
        run: go test -tags=passport -run='^$' -bench=BenchmarkPassportP1 -benchtime=300x -benchmem -timeout=10m ./internal/engine
      - name: P2 bulk create 10k
        run: go test -tags=passport -run='^$' -bench=BenchmarkPassportP2 -benchtime=20x -benchmem -timeout=10m ./internal/engine
      - name: P3 journal replay (100k / 1M)
        run: go test -tags=passport -run='^$' -bench=BenchmarkPassportP3 -benchtime=3x -benchmem -timeout=15m ./internal/eventstore
      - name: P4 auth storm (100 / 1000 actors)
        run: go test -tags=passport -run='^$' -bench=BenchmarkPassportP4 -benchtime=5000x -benchmem -timeout=10m ./internal/engine
