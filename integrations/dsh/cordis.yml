# Kalita agent overlay: mount the kalita node's MCP gateway as DSH tools.
#
# Apply interactively:
#     dsh web --patch integrations/dsh/cordis.yml
# Apply headless (one task per invocation):
#     dsh --profile headless --patch integrations/dsh/cordis.yml "<task>"
#
# Requires env: KALITA_URL (default http://127.0.0.1:8080/mcp) and
# KALITA_TOKEN (the bearer token for an agent role, from `kalita agent add`).
- insert:
    - id: mcp-kalita
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: kalita
        transport: streamable-http
        url: !!js process.env.KALITA_URL || 'http://127.0.0.1:8080/mcp'
        headers:
          Authorization: !!js '`Bearer ${process.env.KALITA_TOKEN}`'
        failOnStartupError: false
