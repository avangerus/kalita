# Kalita on your own iron, in one command:  docker compose up --build
#
# What you get: a node serving HTTPS (self-signed cert generated on first boot),
# with its journal in Postgres and its node key persisted — restart-safe, audited,
# inside your perimeter. Visit https://localhost:8443 (accept the self-signed cert)
# or point an MCP agent at https://localhost:8443/mcp.
#
# Production: mount real certs into the node-data volume's tls/ dir (node.crt /
# node.key), or set KALITA_TLS= empty and run behind a TLS-terminating proxy with
# --insecure-http. Copy .env.example to .env and set POSTGRES_PASSWORD.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kalita}
      POSTGRES_DB: kalita
    volumes:
      - journal:/var/lib/postgresql/data   # the source of truth — back this up
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

  kalita:
    build:
      context: .
      args:
        # OPS-1: the image's reported version comes from here — never the
        # Dockerfile's dev default. Override with KALITA_VERSION at deploy time.
        VERSION: ${KALITA_VERSION:-v1.0.0}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KALITA_PG_DSN: postgres://postgres:${POSTGRES_PASSWORD:-kalita}@postgres:5432/kalita
      KALITA_TLS: ${KALITA_TLS:-self-signed}   # self-contained HTTPS; empty + --insecure-http for proxy mode
      KALITA_TLS_CN: ${KALITA_TLS_CN:-localhost}
      KALITA_EGRESS_DOMAINS: ${KALITA_EGRESS_DOMAINS:-}   # webhook runner allowlist (empty = disabled)
      # Ask Kalita worker URL advertised to the UI (same host, builder port;
      # put a TLS proxy in front of :8400 in production)
      KALITA_BUILDER_URL: ${KALITA_BUILDER_URL:-}
    command: ["serve", "--listen", ":8443", "--data-dir", "/data",
              "--pack", "${KALITA_PACK:-/opt/kalita/packs/builder}",
              "--approver", "${KALITA_APPROVER:-Owner}",
              "--ui-dir", "/opt/kalita/web"]
    volumes:
      - nodedata:/data                      # node key + self-signed cert: persist for audit continuity
    ports:
      - "${KALITA_PORT:-8443}:8443"

  # Ask Kalita — the self-building product's conversational layer
  # (Product Skeptic BLOCKER-1: the builder must ship in the one-command deploy)
  builder:
    build:
      context: .
      dockerfile: Dockerfile.builder
    depends_on:
      - kalita
    environment:
      KALITA_URL: https://kalita:8443
      KALITA_BUILDER_LISTEN: "0.0.0.0:8400"
      KALITA_LLM_URL: ${KALITA_LLM_URL:-}          # empty = deterministic expert mode
      KALITA_LLM_MODEL: ${KALITA_LLM_MODEL:-openai/gpt-oss-20b}
      KALITA_LLM_KEY: ${KALITA_LLM_KEY:-lm-studio}
    ports:
      - "${KALITA_BUILDER_PORT:-8400}:8400"

  prometheus:
    image: prom/prometheus:latest
    depends_on:
      - kalita
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports:
      - "${PROM_PORT:-9090}:9090"
    command: ["--config.file=/etc/prometheus/prometheus.yml"]

volumes:
  journal:
  nodedata:
