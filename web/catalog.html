<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kalita UI — catalog</title>
<!-- Buildless storybook (LLD-05 PK-1 §1): opens with ZERO backend running —
     double-click this file, or serve web/ from disk, or run inside the
     embedded single-binary build. Data comes from catalog-fixtures.js, never
     a real fetch(). See packages/kalita-ui/atoms.js's file header for why
     the vendor import and the kalita-ui import both use the paths below. -->
<link rel="stylesheet" href="../packages/kalita-ui/tokens.css">
<script type="importmap">
{ "imports": { "kalita-vendor": "/vendor/preact-standalone.module.js" } }
</script>
<style>
  *{box-sizing:border-box} body{margin:0;font:14px/1.45 var(--font-sans,system-ui,sans-serif);background:var(--bg);color:var(--fg)}
  a{color:var(--acc);text-decoration:none;cursor:pointer}
  .wrap{max-width:1080px;margin:0 auto;padding:24px 26px 80px}
  h1{font-size:20px;margin:0 0 4px} .lede{color:var(--dim);margin:0 0 24px}
  h2{font-size:16px;border-bottom:1px solid var(--line);padding-bottom:8px;margin:40px 0 14px}
  h2:first-of-type{margin-top:0}
  h3{font-size:13px;color:var(--dim);text-transform:uppercase;letter-spacing:.04em;margin:22px 0 8px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius,6px);padding:14px;margin-bottom:12px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
  .ex{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius,6px);padding:10px 12px}
  .ex .cap{color:var(--dim);font-size:11px;margin-bottom:6px;text-transform:uppercase;letter-spacing:.03em}
  table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);font-size:13px} th{color:var(--dim);font-weight:500}
  input,select,textarea{width:100%;background:var(--input-bg,#0d1217);color:var(--fg);border:1px solid var(--line);border-radius:var(--radius,6px);padding:7px 9px;font-size:13px;margin:3px 0 10px}
  label{font-size:12px;color:var(--dim)}
  .pill{display:inline-block;padding:1px 8px;border-radius:9px;font-size:11px;background:#223041}
  .btn{display:inline-block;background:#223041;color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:6px 12px;cursor:pointer;font-size:13px;margin-right:6px}
  .btn.green{background:var(--ok-soft,#15301f);border-color:var(--ok)} .btn.red{background:var(--bad-soft,#33201c);border-color:var(--bad)}
  .muted{color:var(--dim);font-size:12px}
  .err{color:var(--bad);font-size:13px}
  .cols{display:flex;gap:12px;overflow-x:auto} .col{min-width:200px;flex:1}
  .col h4{font-size:12px;color:var(--dim);margin:0 0 8px;text-transform:uppercase}
  .kcard{background:#12171d;border:1px solid var(--line);border-radius:8px;padding:9px 11px;margin-bottom:8px;cursor:pointer}
  .knobs{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin-bottom:12px}
</style>
</head>
<body>
<div id="root"></div>
<script type="module" src="./catalog.js"></script>
</body>
</html>
