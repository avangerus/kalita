<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kalita</title>
<!-- kalita-ui tokens.css is the single source of design tokens (LLD-05
     PK-1) — --bg/--panel/--line/--fg/--dim/--acc/--ok/--warn/--bad live
     there now, not here; a brand manifest overrides them by re-declaring on
     :root AFTER this stylesheet. Path is relative (not "/packages/...")
     so this page resolves identically off disk, via `--ui-dir`, and via the
     embedded single-binary build — see cmd/kalita/main.go and
     scripts/embed-ui.sh for why. -->
<link rel="stylesheet" href="../packages/kalita-ui/tokens.css">
<!-- import map: lets packages/kalita-ui/*.js (which lives OUTSIDE web/) import
     the SAME vendored preact+htm bundle web/app.js uses, via a bare
     specifier resolved relative to THIS page rather than to atoms.js's own
     (unstable-across-serving-modes) location. See atoms.js's file header. -->
<script type="importmap">
{ "imports": { "kalita-vendor": "/vendor/preact-standalone.module.js" } }
</script>
<style>
  /* ENH-03 shell redesign — layout/spacing/radii/shadows/typography now read
     from kalita-ui's tokens.css scale (--space-*/--radius-*/--shadow-*/--font-*)
     instead of one-off pixel literals, so the whole shell moves together when
     a brand manifest or a future token edit changes the scale. Domain-neutral:
     this file has no knowvault/entity-specific rule — those live in the
     .search-hero/.dropzone/.upload-*/.source-hit rules further down, which
     ARE product-layer (ADR-004 layer 3), same status as .search-bar's
     predecessor's inline max-width:720px it replaces. */
  *{box-sizing:border-box}
  body{margin:0;font:var(--font-size)/var(--line-height) var(--font-sans);background:var(--bg);color:var(--fg)}
  a{color:var(--acc);text-decoration:none;cursor:pointer}

  /* a11y: a visible focus ring everywhere a keyboard user can land — buttons,
     links, form controls and the few plain elements we opt into tabbing
     (dropzone, custom nav). Kept to :focus-visible so mouse users don't see it. */
  a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible,
  textarea:focus-visible, [tabindex]:focus-visible {
    outline:2px solid var(--acc); outline-offset:2px; border-radius:var(--radius-sm);
  }

  /* visually-hidden but screen-reader-visible text (e.g. "Connecting…" behind a skeleton) */
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
    clip:rect(0,0,0,0);white-space:nowrap;border:0}

  /* --- shell: sidebar + main ------------------------------------------------ */
  .shell{display:flex;min-height:100vh}
  .side{width:220px;background:var(--panel);border-right:1px solid var(--line);
    padding:var(--space-4);flex-shrink:0;display:flex;flex-direction:column;
    transition:width .15s ease,padding .15s ease}
  .side.collapsed{width:64px;padding:var(--space-4) var(--space-2)}
  .side.collapsed h1{display:none}
  .side.collapsed .lbl{display:none}
  .side-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:4px}
  .side h1{font-size:var(--font-size-lg);margin:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
  .side .who{color:var(--dim);font-size:var(--font-size-sm);margin-bottom:var(--space-4)}
  .side-toggle{flex:none;background:none;border:1px solid var(--line);color:var(--dim);
    border-radius:var(--radius-sm);width:28px;height:28px;min-height:28px;cursor:pointer;padding:0}
  .side-toggle:hover{border-color:var(--acc);color:var(--fg)}
  .nav{display:flex;flex-direction:column}
  .nav a{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:var(--radius);
    color:var(--fg);min-height:36px}
  .nav a.on,.nav a:hover{background:var(--acc-soft)}
  .nav .badge{margin-left:auto;background:var(--acc);color:var(--acc-fg);border-radius:9px;
    padding:0 7px;font-size:11px;font-weight:600}
  .navdot{display:none;align-items:center;justify-content:center;width:20px;height:20px;
    border-radius:50%;background:var(--acc-soft);font-size:11px;font-weight:600;flex:none;
    text-transform:uppercase}
  .side.collapsed .navdot{display:inline-flex}

  .main{flex:1;min-width:0;width:100%;max-width:1600px;margin:0 auto;
    padding:var(--space-5) clamp(var(--space-4),4vw,var(--space-5))}
  /* .narrow: the "textual" screens (Search hero, Upload) get a readable
     centered column instead of stretching across a wide/4K viewport — the
     other half of ENH-03's width rule ("wide views use the screen, textual
     views get a column"); tables/board/dashboards/agent-board keep the full
     .main width above and are NOT wrapped in this. */
  .narrow{max-width:720px;margin-left:auto;margin-right:auto}

  h2{font-size:var(--font-size-lg);margin:0 0 var(--space-4);letter-spacing:-.01em}
  h3{font-size:var(--font-size);color:var(--dim);margin:var(--space-5) 0 var(--space-2);font-weight:600}
  table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);
    border-radius:var(--radius-lg);overflow:hidden}
  th,td{text-align:left;padding:var(--space-2) var(--space-3);border-bottom:1px solid var(--line);
    font-size:var(--font-size-sm)}
  th{color:var(--dim);font-weight:500}
  tr:hover td{background:var(--acc-soft);cursor:pointer}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-lg);
    padding:var(--space-4);margin-bottom:var(--space-3);box-shadow:var(--shadow-card)}
  .btn{display:inline-flex;align-items:center;justify-content:center;min-height:34px;
    background:#223041;color:var(--fg);border:1px solid var(--line);border-radius:var(--radius);
    padding:6px 14px;cursor:pointer;font-size:var(--font-size-sm);margin-right:6px}
  .btn:hover{border-color:var(--acc)}
  .btn.green{background:var(--ok-soft);border-color:var(--ok)}
  .btn.red{background:var(--bad-soft);border-color:var(--bad)}
  input,select,textarea{width:100%;min-height:36px;background:var(--input-bg);color:var(--fg);
    border:1px solid var(--line);border-radius:var(--radius);padding:7px 10px;
    font-size:var(--font-size-sm);margin:3px 0 10px}
  textarea{min-height:0}
  label{font-size:var(--font-size-sm);color:var(--dim)}
  .pill{display:inline-block;padding:1px 8px;border-radius:9px;font-size:11px;background:#223041}
  .err{color:var(--bad);font-size:var(--font-size-sm);margin:var(--space-2) 0}
  .cols{display:flex;gap:var(--space-3);overflow-x:auto} .col{min-width:200px;flex:1}
  .col h4{font-size:var(--font-size-sm);color:var(--dim);margin:0 0 var(--space-2);text-transform:uppercase}
  .kcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:9px 11px;margin-bottom:var(--space-2);cursor:pointer}
  .kcard:hover{border-color:var(--acc)}
  .login{max-width:360px;margin:14vh auto}
  .muted{color:var(--dim);font-size:var(--font-size-sm)}
  .tabs a{margin-right:var(--space-4);color:var(--dim)} .tabs a.on{color:var(--fg);border-bottom:2px solid var(--acc)}
  pre{background:var(--input-bg);border:1px solid var(--line);border-radius:var(--radius);padding:var(--space-2);font-size:12px;overflow-x:auto}
  .modal-bg{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;z-index:50}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-lg);width:700px;max-width:92vw;max-height:84vh;display:flex;flex-direction:column;box-shadow:var(--shadow-modal)}
  .modal-head{padding:14px 16px 12px;border-bottom:1px solid var(--line)} .modal-head b{font-size:15px}
  .modal-body{padding:0 16px;overflow:auto;flex:1} .modal-body table{border:none;border-radius:0}
  .modal-foot{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:8px;align-items:center}

  /* --- skeleton loading (ENH-03: "states as design", replaces literal
     "loading…" text at the shell level and in the Search hero) ------------ */
  .skel{position:relative;overflow:hidden;background:var(--acc-soft);border-radius:var(--radius)}
  .skel::after{content:"";position:absolute;inset:0;transform:translateX(-100%);
    background:linear-gradient(90deg,transparent,#ffffff14,transparent);
    animation:skel-shimmer 1.3s infinite}
  @keyframes skel-shimmer{100%{transform:translateX(100%)}}
  @media (prefers-reduced-motion: reduce){.skel::after{animation:none}}

  /* --- ENH-04b: Search hero — clickable source cards --------------------- */
  .search-hero{padding-top:2vh}
  .search-bar{display:flex;gap:var(--space-2);align-items:flex-start;flex-wrap:wrap}
  .search-hint{margin:var(--space-2) 0}
  .search-answer .answer-text{white-space:pre-wrap;line-height:1.6;font-size:15px}
  .source-hits{border-top:1px solid var(--line);padding-top:var(--space-2);margin-top:var(--space-3)}
  .source-hit{border:1px solid var(--line);border-radius:var(--radius);margin-bottom:var(--space-2);
    overflow:hidden;background:var(--input-bg)}
  .source-hit-head{width:100%;display:flex;align-items:center;gap:8px;text-align:left;
    background:none;border:none;color:var(--fg);padding:10px 12px;cursor:pointer;
    font-size:var(--font-size-sm);min-height:40px;font-family:inherit}
  .source-hit-head:hover{background:var(--acc-soft)}
  .source-hit-name{font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .source-hit-anchor,.source-hit-chevron{flex:none;color:var(--dim)}
  .source-hit-body{padding:0 12px 12px;font-size:var(--font-size-sm);line-height:1.55}
  .source-hit-body mark{background:var(--warn-soft);color:var(--fg);border-radius:2px;padding:0 2px}

  /* --- ENH-01: drag-drop bulk upload -------------------------------------- */
  .dropzone{border:2px dashed var(--line);border-radius:var(--radius-lg);padding:var(--space-5);
    text-align:center;cursor:pointer;transition:border-color .15s,background .15s,color .15s;
    color:var(--dim)}
  .dropzone:hover,.dropzone:focus-visible{border-color:var(--acc)}
  .dropzone.drag-over{border-color:var(--acc);background:var(--acc-soft);color:var(--fg)}
  .dropzone.disabled{cursor:not-allowed;opacity:.6}
  .dropzone-icon{font-size:28px;margin-bottom:8px}
  .upload-list{margin-top:var(--space-3)}
  .upload-row{display:flex;align-items:center;gap:10px;padding:8px 10px;border-bottom:1px solid var(--line);
    font-size:var(--font-size-sm)}
  .upload-row-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .upload-row-size{flex:none;width:70px;text-align:right}
  .upload-row-status{flex:none;width:150px;text-align:right}
  .status-error{color:var(--bad)}
  .status-done{color:var(--ok)}

  /* --- responsive: narrow viewport stacks the shell ----------------------- */
  @media (max-width: 720px){
    .shell{flex-direction:column}
    .side{width:100%!important;border-right:none;border-bottom:1px solid var(--line);padding:var(--space-3)}
    .side.collapsed h1{display:block}
    .side.collapsed .lbl{display:inline}
    .side.collapsed .navdot{display:none}
    .main{padding:var(--space-4)}
  }
</style>
</head>
<body>
<div id="root"></div>
<script type="module" src="/app.js"></script>
</body>
</html>
